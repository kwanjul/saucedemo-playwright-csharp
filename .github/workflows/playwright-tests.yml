name: Playwright C# Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'
      timezone: 'America/New_York'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore

      - name: Install Playwright Chromium
        run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright tests
        run: dotnet test --no-build --logger "html;LogFileName=TestReport.html" --results-directory ./TestResults

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: TestResults/
          if-no-files-found: warn