name: Playwright C# Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore

      - name: Install Playwright Chromium
        run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright tests
        run: dotnet test --no-build --logger "html;LogFileName=TestReport.html" --results-directory ./TestResults

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Prepare GitHub Pages report
        if: always()
        env:
          TZ: America/New_York
        run: |
          mkdir -p pages
          if [ -f TestResults/TestReport.html ]; then
            cp TestResults/TestReport.html pages/index.html

            RUN_DATE=$(date '+%B %d, %Y at %I:%M %p %Z')

            python3 - "$RUN_DATE" <<'PY'
          import sys
          from pathlib import Path
          from html import escape

          report = Path("pages/index.html")
          html = report.read_text(encoding="utf-8")
          timestamp = escape(sys.argv[1])

          html = html.replace(
              "<h1>Test run details</h1>",
              f"<h1>Test run details</h1><p><strong>Last run:</strong> {timestamp}</p>",
              1
          )

          report.write_text(html, encoding="utf-8")
          PY
          else
            echo "<h1>Test report unavailable</h1>" > pages/index.html
          fi

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v5